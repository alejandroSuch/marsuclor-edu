name: Validar i publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: podcast-pages-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - run: pip install -r requirements.txt -r requirements-publish.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py validate
      - run: npm ci && npm test && npm run typecheck
        working-directory: infrastructure/cloudflare
      - name: Prepare bucket and deploy Worker
        run: npm run bootstrap
        working-directory: infrastructure/cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BOOTSTRAP_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARTINA_AUDIO_BASE_URL: ${{ vars.MARTINA_AUDIO_BASE_URL }}
      - name: Reuse or synthesize published podcasts
        run: python scripts/build.py tts sync --all --download-models
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: martina-edu-podcasts
          MARTINA_AUDIO_BASE_URL: ${{ vars.MARTINA_AUDIO_BASE_URL }}
      - run: python scripts/build.py prepare
      - run: quarto render generated --to html
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build.py pdf
      - run: python scripts/build.py verify
      - name: Include verified podcast manifest in Pages
        run: cp audio/published.json site/podcast-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
