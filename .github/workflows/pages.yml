name: Validar i publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            site
            .build-cache
          key: pages-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-${{ runner.os }}-
      - run: python scripts/build.py validate
      - run: python scripts/build.py prepare
      - run: python scripts/build.py render
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build.py pdf
      - run: python scripts/build.py verify
      - uses: actions/cache/save@v4
        with:
          path: |
            site
            .build-cache
          key: pages-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
