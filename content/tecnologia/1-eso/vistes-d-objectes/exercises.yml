  question: 'Peça A (dos graons paral·lels): dibuixa l''alçat, la planta i el perfil dret sobre les quadrícules. Traça el
    contorn i les arestes visibles.'
  answer: 'Alçat, planta i perfil dret: vegeu les línies fosques del dibuix resolt. Comprovació d''alçades: alçat, d''esquerra
    a dreta, 2, 1; perfil dret, del davant cap al fons, 2, 2. Alçades de la planta per files, del davant cap al fons: 2 1
    / 2 1 (0 = buit).'
  diagram_id: peca-01
  answer_space_mm: 8
