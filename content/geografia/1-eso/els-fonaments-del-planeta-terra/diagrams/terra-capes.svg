  <title id="title">Capes internes de la Terra</title>
  <desc id="desc">Tall esquemàtic amb tres capes concèntriques numerades de fora cap a dins.</desc>
  <rect width="760" height="320" fill="#fff"/>
  <circle cx="170" cy="160" r="133" fill="#417985"/>
  <circle cx="170" cy="160" r="118" fill="#d7a35b"/>
  <circle cx="170" cy="160" r="57" fill="#c45742"/>
  <path d="M285 90 L365 53 M267 125 L365 139 M220 183 L365 226" fill="none" stroke="#243c45" stroke-width="2"/>
  <g fill="#fff" stroke="#243c45" stroke-width="2">
    <circle cx="385" cy="52" r="16"/><circle cx="385" cy="139" r="16"/><circle cx="385" cy="226" r="16"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#203442">
