    <g transform="translate(18 462)">
      <rect width="420" height="134" fill="#dceff4" stroke="#9dbac2"/>
      <ellipse cx="164" cy="60" rx="30" ry="20" fill="#d9c49e" stroke="#8e7756" stroke-width="2"/>
      <ellipse cx="242" cy="43" rx="40" ry="21" fill="#d9c49e" stroke="#8e7756" stroke-width="2"/>
      <ellipse cx="296" cy="76" rx="24" ry="17" fill="#d9c49e" stroke="#8e7756" stroke-width="2"/>
