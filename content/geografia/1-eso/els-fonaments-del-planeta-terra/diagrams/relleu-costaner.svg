<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
  <title id="title">Formes del relleu costaner</title>
  <desc id="desc">Set esquemes numerats de península, golf, cap, delta, estuari, illa i arxipèlag.</desc>
  <rect width="900" height="610" fill="#fff"/>
  <g font-family="Arial,sans-serif" font-size="17" fill="#203442" stroke-linejoin="round">
    <g transform="translate(18 12)">
