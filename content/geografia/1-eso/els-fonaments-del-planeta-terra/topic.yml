title: Els fonaments del planeta Terra
course: 1-eso
subject: geografia
teaching_language: ca-valencia
status: revisat amb els apunts
intro: >-
  Guia d'estudi de Geografia de 1r d'ESO. Les quatre respostes i les definicions
  procedixen de la guia d'estudi ja elaborada; els apunts de classe s'han utilitzat
  per a comprovar els objectius i el vocabulari de l'examen.
objectives:
  - {id: o1, text: Entendre els moviments de la Terra i les seues conseqüències.}
  - {id: o2, text: Explicar les causes que hi haja vida a la Terra.}
  - {id: o3, text: Identificar en un diagrama les capes de la Terra.}
  - {id: o4, text: Explicar els processos de formació i erosió del relleu.}
