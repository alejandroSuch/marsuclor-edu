source_note: >-
  La llista de l'examen conté 33 termes, inclosos «paral·lels» i «meridians»
  afegits a mà. La guia aporta també «latitud» i «longitud»: es conserven com a
  termes de suport, fora dels 33. Les definicions i les ampliacions provenen de
  la guia; no s'atribuïxen literalment als apunts manuscrits. Els exercicis,
  les solucions, les targetes i els esquemes són elaboracions didàctiques a
  partir d'eixa teoria i del vocabulari, no transcripcions dels documents.
