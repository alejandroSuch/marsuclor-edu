source_note: >-
  Els exercicis i les targetes són elaboracions didàctiques dels apunts. La taula
  de classe és orientativa: les dates de la prehistòria varien segons la regió;
  «Homo sapiens, fa 176.000 anys» s'actualitza a aproximadament 300.000 anys
  segons Smithsonian. La fitxa que presenta Homo erectus com el primer bípede
  es corregix: el bipedisme és molt anterior. No es presenta Homo antecessor
  com a avantpassat directe segur de sapiens i neandertals; la seua posició és
  objecte d'estudi segons Atapuerca. L'art llevantí no es reduïx sense matisos
  al Neolític, ni s'assigna una data única; UNESCO el descriu com a art de la
  prehistòria tardana. Los Millares i El Argar es denominen cultures, no
  «primeres civilitzacions». Les interpretacions rituals de les pintures i les
  figures femenines són hipòtesis. La font privada inclou nom d'alumna i
  material editorial fotocopiable: no s'incorpora cap pàgina, imatge ni nom.
