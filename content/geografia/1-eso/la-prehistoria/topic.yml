title: La prehistòria
course: 1-eso
subject: geografia
teaching_language: ca-valencia
status: preparat a partir dels apunts de classe
intro: >-
  Guia d'estudi de 1r d'ESO sobre l'evolució humana i les etapes de la prehistòria.
  Reunix els coneixements bàsics indicats en classe, amb exercicis, solucions i
  targetes de repàs.
objectives:
  - {id: o1, text: Explicar els canvis principals de l'hominització i situar l'origen africà i l'expansió dels hominins.}
  - {id: o2, text: Descriure la vida, l'economia i les ferramentes del Paleolític.}
  - {id: o3, text: Relacionar agricultura i ramaderia amb el sedentarisme i els canvis del Neolític.}
  - {id: o4, text: Reconéixer la metal·lúrgia, les etapes de l'edat dels metalls i les restes de Los Millares i El Argar.}
  - {id: o5, text: Distingir l'art cantàbric, el llevantí i les construccions megalítiques amb exemples.}
