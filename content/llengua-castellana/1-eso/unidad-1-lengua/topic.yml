source_note: >-
  La fotografía manuscrita fija el alcance del examen. El cuadernillo desarrolla
  la separación silábica y la estructura de las palabras; el esquema y las
  páginas de clase sustentan los apartados de textos, ámbitos y géneros. El
  cuadernillo contiene otros contenidos de significado de las palabras que no
  figuran en la lista del examen y no se incluyen aquí. El simulacro reciente
  confirma los formatos de pregunta y añade la clasificación de palabras por
  formación; la explicación nueva y los ejemplos son una elaboración didáctica,
  no una transcripción del examen ni de sus respuestas manuscritas. Los ejercicios, las
  soluciones y las tarjetas son elaboraciones didácticas, no copias de los
  documentos. Las listas ampliadas de categorías gramaticales proceden de la
  Nueva gramática básica de la RAE-ASALE y son una ampliación de repaso, no
  una transcripción atribuida a las páginas de clase. Los archivos originales
  permanecen fuera del repositorio público.
