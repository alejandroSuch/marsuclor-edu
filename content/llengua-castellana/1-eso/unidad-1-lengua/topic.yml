title: "Unidad 1 · Lengua castellana: textos, palabras y sílabas"
course: 1-eso
subject: llengua-castellana
teaching_language: es
status: "Repaso ajustado a la lista del examen"
intro: >-
  Guía de repaso de 1.º de ESO basada en la lista manuscrita del examen, las
  páginas de clase y el cuadernillo de Lengua. Primero estudia los ejemplos;
  después practica sin mirar las soluciones y usa las tarjetas para comprobarte.
objectives:
  - {id: o1, text: "Separar palabras en sílabas y reconocer diptongos, hiatos y triptongos."}
  - {id: o2, text: "Distinguir los seis tipos de texto por su finalidad."}
  - {id: o3, text: "Reconocer los ámbitos de uso cotidiano, académico y de los medios de comunicación."}
  - {id: o4, text: "Identificar los géneros literarios narrativo, lírico y teatral."}
  - {id: o5, text: "Explicar qué es una palabra, reconocer las categorías gramaticales y clasificar palabras variables e invariables."}
  - {id: o6, text: "Separar lexemas y morfemas y distinguir morfemas flexivos y derivativos."}
  - {id: o7, text: "Distinguir palabras simples, derivadas y compuestas por su formación."}
