  <g fill="#173b4a" font-family="Arial,sans-serif" font-size="20"><text x="38" y="89">A</text><text class="diagram-answer" x="65" y="89">Barret</text><text x="732" y="129">B</text><text class="diagram-answer" x="757" y="129">Làmines</text><text x="37" y="264">C</text><text class="diagram-answer" x="63" y="264">Cama</text><text x="754" y="346">D</text><text class="diagram-answer" x="778" y="346">Hifes</text><text x="38" y="435">E</text><text class="diagram-answer" x="62" y="435">Miceli</text></g>
