<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Parts d'un fong amb bolet</title>
  <desc id="desc">Esquema original basat en els apunts: el barret i les làmines es troben damunt de la cama; davall del sòl hi ha hifes que formen el miceli. Les espores ixen de les làmines.</desc>
