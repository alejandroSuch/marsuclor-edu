title: Els microorganismes
course: 1-eso
subject: biologia
teaching_language: ca-valencia
status: Elaborat a partir dels apunts de classe i del quadern adaptat de la professora
intro: >-
  Tema 5 de Biologia i Geologia de 1r d'ESO. Estudia els microorganismes,
  els bacteris, els protozous, les algues, els fongs i els virus; practica
  amb activitats i comprova les solucions.
objectives:
  - {id: o1, text: Definir microorganisme i comparar les dos classificacions presents en els materials.}
  - {id: o2, text: Reconéixer l'estructura, les formes, les funcions vitals i la importància dels bacteris.}
  - {id: o3, text: Identificar els protozous pels seus moviments, nutrició i paper en el medi.}
  - {id: o4, text: Comparar algues microscòpiques i macroscòpiques, fotosíntesi i importància ecològica.}
  - {id: o5, text: Distingir llevats, floridures i fongs amb bolet, i explicar el miceli i la reproducció.}
  - {id: o6, text: Identificar les parts d'un virus i explicar per què necessita una cèl·lula per a multiplicar-se.}
  - {id: o7, text: Relacionar exemples amb grups i valorar beneficis, riscos i hàbits de prevenció.}
