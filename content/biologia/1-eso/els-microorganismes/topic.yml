source_note: >-
  Els apunts agrupen bacteris i arqueus en «moneres», i protozous i algues en
  «protoctists»; el quadern treballa la classificació de set regnes i separa
  Bacteria, Protozoa, Chromista i Fungi. A més, situa parameci i plasmodi en
  Chromista, mentre que els apunts els posen amb els protozous. El tema
  conserva els exemples i mostra explícitament a quin esquema correspon cada
  etiqueta, sense presentar les dos taules com si foren idèntiques.
  Propostes de precisió: les cianobacteris fan fotosíntesi, per això la
  resposta «cap bacteri fa fotosíntesi» del repàs del quadern és falsa; una
  colònia bacteriana pot ser visible però no permet veure cada bacteri a ull
  nu; les espores de resistència bacterianes no són espores reproductores;
  no tots els fongs pluricel·lulars formen bolets ni totes les espores dels
  fongs provenen d'un bolet; els virus poden romandre fora de cèl·lules però
  només es multipliquen dins d'una cèl·lula hoste. El solucionari del quadern
  menciona activitats de microscopi i un taller de llevats que no figuren en
  les fitxes lliurades; no s'han convertit en objectius. Els apunts, exercicis,
  solucions, targetes i diagrames nous són una elaboració didàctica amb
  procedència indicada per bloc.
