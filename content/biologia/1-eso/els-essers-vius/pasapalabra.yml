title: Pasapalabra de biologia
intro: Llig la pista, pensa el concepte i prem «Mostra el concepte» per comprovar-lo. En el PDF pots escriure les respostes i consultar el solucionari al final.
groups:
  - letter: A
    clues:
      - {id: a01, answer: ADN, clue: "Molècula que guarda la informació genètica i les instruccions per al funcionament cel·lular.", objective_ids: [o1], source_ids: [pasapalabra]}
      - {id: a02, answer: AUTÒTROFS, clue: "Éssers vius capaços de fabricar la seua pròpia matèria orgànica.", objective_ids: [o3], source_ids: [pasapalabra]}
      - {id: a03, answer: ASEXUAL, clue: "Reproducció en què participa un sol progenitor i la descendència sol ser genèticament molt semblant.", objective_ids: [o4], source_ids: [pasapalabra]}
      - {id: a04, answer: AIGUA, clue: "Substància inorgànica molt abundant en els éssers vius i present en líquids com la sang.", objective_ids: [o1], source_ids: [pasapalabra]}
      - {id: a05, answer: ÀCIDS NUCLEICS, clue: "Grup de substàncies orgàniques al qual pertany l'ADN.", objective_ids: [o1], source_ids: [pasapalabra]}
