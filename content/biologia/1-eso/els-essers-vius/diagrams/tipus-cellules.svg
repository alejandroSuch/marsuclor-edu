<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Tres tipus de cèl·lules</title>
  <desc id="desc">A no té nucli; B té nucli i no té paret; C té nucli, paret, cloroplasts i vacúol gran.</desc>
