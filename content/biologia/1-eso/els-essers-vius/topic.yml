title: Els éssers vius
course: 1-eso
subject: biologia
teaching_language: ca-valencia
status: Elaborat a partir dels apunts de classe
intro: >-
  Guia d'estudi de Biologia de 1r d'ESO sobre la composició, les cèl·lules,
  les funcions vitals i la classificació dels éssers vius. Estudia els
  exemples, practica i comprova les respostes amb el solucionari.
objectives:
  - {id: o1, text: Reconéixer les característiques dels éssers vius i distingir les substàncies orgàniques i inorgàniques.}
  - {id: o2, text: Identificar les parts comunes de les cèl·lules i comparar cèl·lules procariotes, animals i vegetals.}
  - {id: o3, text: Explicar la nutrició autòtrofa i heteròtrofa i les seues relacions.}
  - {id: o4, text: Explicar la funció de relació i distingir reproducció sexual i asexual.}
  - {id: o5, text: Ordenar les categories taxonòmiques i explicar què és una espècie i com s'anomena.}
  - {id: o6, text: Comparar els sis grups treballats a classe i explicar la biodiversitat.}
