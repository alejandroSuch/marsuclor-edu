source_note: >-
  Les 21 fotografies són apunts i exercicis de classe, no una guia desenvolupada.
  El curs de 1r d'ESO es deduïx de la seqüència i del context del repositori;
  no apareix escrit a les pàgines. Els exercicis, les solucions, les targetes
  i l'esquema són elaboracions didàctiques. Propostes de precisió científica
  respecte a les simplificacions dels apunts: (1) «inorgànic» no significa
  sempre «sense carboni», perquè el diòxid de carboni és inorgànic; (2) la
  matèria no viva també pot ser orgànica; (3) els cloroplasts apareixen en
  plantes i moltes algues, i les parets cel·lulars també en bacteris i fongs;
  (4) la nutrició autòtrofa no sempre implica fotosíntesi; (5) els grups de
  protozous i algues són categories escolars simplificades, no regnes
  taxonòmics universals. No es copien com a fets absoluts les afirmacions
  errònies dels originals. La definició d'espècie per descendència fèrtil
  és una aproximació útil per al curs, amb excepcions.
