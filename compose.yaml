services:
  web:
    build: .
    init: true
    ports:
      - "8000:8000"
    volumes:
      - .:/app:ro
      - generated:/app/generated
      - site:/app/site
  tts:
    profiles: [tts]
    build:
      context: .
      dockerfile: Dockerfile.tts
    init: true
    volumes:
      - .:/app:ro
      - ./models:/app/models
      - ./audio:/app/audio

volumes:
  generated:
  site:
