materials:
  podcast:
    generation: on_demand
    format: narration
    duration_minutes: 12
    tts:
      engine: piper
      voices:
        ca-valencia: {model: ca_ES-upc_ona-medium}
        es: {model: es_ES-davefx-medium}
      length_scale: 1.0
      noise_scale: 0.667
      noise_w_scale: 0.8
      volume: 1.0
      audio_format: mp3
      output_sample_rate: 44100
      mp3_bitrate_kbps: 128
      loudness_lufs: -20
      true_peak_db: -1.5
      sample_seconds: 38
      sentence_pause_seconds: 0.5
      paragraph_pause_seconds: 0.8
subjects:
  valencia: {label: "Valencià", teaching_language: ca-valencia, materials: {podcast: {generation: default}}}
  biologia: {label: "Biologia", teaching_language: ca-valencia, materials: {podcast: {generation: default}}}
  frances: {label: "Francès", teaching_language: configurable}
  angles: {label: "Anglès", teaching_language: configurable}
  geografia: {label: "Geografia", teaching_language: ca-valencia, materials: {podcast: {generation: default}}}
  matematiques: {label: "Matemáticas", teaching_language: es}
  educacio-fisica: {label: "Educació física", teaching_language: configurable}
  llengua-castellana: {label: "Lengua castellana", teaching_language: es, materials: {podcast: {generation: default}}}
  musica: {label: "Música", teaching_language: es}
